# The manifest of the figures. One [[figure]] table per figure, whose source is
# src/<topic>/<name>/<name>.tex:
#
#   name     the figure's name, also its URL; no underscore, and permanent once deployed
#   topic    the site page that shows it
#   caption  one sentence
#   engine   "xelatex" (the default when absent) or "pdflatex"

