# A symplectic autoencoder trained on the pendulum, and its latent space at the separatrix
# (the paper on symplectic autoencoders, arXiv:2312.10004).
[[figure]]
name = "pendulum-phase-portrait"
topic = "pendulum-autoencoder"
caption = "The phase portrait of the pendulum: librating orbits (blue) around θ = π, rotating orbits (orange), and the separatrix (red, dashed) through the unstable equilibria."
engine = "pdflatex"

[[figure]]
name = "pendulum-solution-manifold"
topic = "pendulum-autoencoder"
caption = "The solution manifold of the lifted pendulum, the phase portrait with its edges θ = 0 and θ = 2π glued into a cylinder."
engine = "pdflatex"

[[figure]]
name = "angle-atlas"
topic = "pendulum-autoencoder"
caption = "Angle charts on the pendulum's cylinder: a librating orbit fits in one chart, a rotating orbit needs two."
engine = "pdflatex"

[[figure]]
name = "librating-area"
topic = "pendulum-autoencoder"
caption = "The angular action of a librating pendulum orbit, the area it encloses."
engine = "pdflatex"

[[figure]]
name = "rotating-area"
topic = "pendulum-autoencoder"
caption = "The angular action of a rotating pendulum orbit, the area under its branch down to p = 0."
engine = "pdflatex"

[[figure]]
name = "separatrix-limit-below"
