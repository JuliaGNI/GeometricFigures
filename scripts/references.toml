# The original sources that `scripts/compare.jl` compares the figures with. One [[reference]] table
# per original source of one theme of one figure; a figure and theme can have several.
#
#   name        the figure's name in src/figures.toml
#   theme       "light" or "dark"
#   repository  the name of the checkout that holds the original, in ~/Research/Packages or
#               ~/Research/Experiments
#   path        the original .tex on that repository's origin/main
#   engine      the engine that compiled the original: "xelatex" or "pdflatex"
#   runs        optional: how many times the original's build ran the engine, a positive integer;
#               1 where it is not given
#   dpi         the resolution at which the original was rendered to PNG
#   untracked   optional: files or directories, relative to the directory of `path`, that the
#               local working tree has and origin/main lacks

[[reference]]
name = "dogleg-tikz"
theme = "light"
repository = "SimpleSolvers"
path = "docs/src/trust_region/dogleg_tikz_light.tex"
engine = "pdflatex"
dpi = 300

